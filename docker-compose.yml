# Local development services. Production uses Render PostgreSQL and AWS S3.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: evidencechase
      POSTGRES_PASSWORD: evidencechase
      POSTGRES_DB: evidencechase
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the separate database used by integration tests.
      - ./infra/local/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U evidencechase']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object store, used locally instead of AWS S3. RustFS (Apache-2.0) supports
  # everything the upload pipeline needs: presigned POST policies, tagging, copy and Object Lock.
  # (MinIO's Docker images are no longer published.) Create the bucket with: pnpm storage:setup
  s3:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: evidencechase
      RUSTFS_SECRET_KEY: evidencechase-secret
    ports:
      - '9000:9000'
    volumes:
      - s3-data:/data

volumes:
  postgres-data:
  s3-data:
