# Render Blueprint: the API and its Postgres database, in Singapore (closest to India, and next to
# the S3 bucket). In Render: New → Blueprint → pick this repo. Values marked `sync: false` are
# asked for during setup; secrets marked `generateValue` are created by Render.
databases:
  - name: evidencechase-db
    plan: free
    region: singapore
    databaseName: evidencechase
    user: evidencechase

services:
  - type: web
    name: evidencechase-api
    runtime: node
    plan: free
    region: singapore
    rootDir: apps/api
    # --prod=false: with NODE_ENV=production pnpm would skip the dev dependencies the build needs.
    # Migrations run here because pre-deploy commands are a paid feature.
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm build && pnpm db:deploy
    startCommand: pnpm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: UTC
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: evidencechase-db
          property: connectionString # the internal URL: traffic stays inside Render
      - key: SESSION_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: EXPORT_SIGNING_SECRET
        generateValue: true
      # Vercel → Cloudflare → Render's load balancer → Render's local proxy: four hops in
      # x-forwarded-for before the real client (checked against production request logs).
      - key: TRUST_PROXY
        value: '4'
      - key: WEB_ORIGIN
        sync: false # https://<your-app>.vercel.app
      # API_PUBLIC_URL isn't needed: the API uses RENDER_EXTERNAL_URL, which Render sets itself.
      - key: AWS_REGION
        value: ap-southeast-2
      - key: S3_BUCKET
        sync: false # evidencechase-prod
      - key: AWS_ACCESS_KEY_ID
        sync: false # the least-privilege IAM user (infra/aws/api-policy.json)
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      # GuardDuty Malware Protection is a paid AWS service, so the demo deployment runs without it.
      # Files are still checked by content, fingerprinted and locked. Set 'true' once GuardDuty
      # protects quarantine/ on the bucket.
      - key: MALWARE_SCAN_ENABLED
        value: 'false'
      - key: OBJECT_LOCK_RETENTION_DAYS
        value: '90'
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false # EvidenceChase <evidence@your-verified-domain>
